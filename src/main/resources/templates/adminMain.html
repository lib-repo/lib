<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 메인페이지</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            integrity="sha256-9kPW/n5nn53j4WMRYAxe9c1rCY96Oogo/MKSVdKzPmI="
            crossorigin="anonymous"
    />
    <link rel="stylesheet" type="text/css" th:href="@{/css/adminlte.css}">
    <script type="text/javascript" th:src="@{/js/adminSidebar.js}"></script>
    <style>
      main {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 840px;
        margin-left: 500px;
        /* background-color: #f4f4f4; */
      }
   
      .container {
        margin-top: -40px;
        width: 500px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 50px;
        padding: 20px;
        border-radius: 10px;
        /* box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); */
        transform: scale(2); /* 크기 확대 */
      }
      .box {
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background-color: #dee2e6;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
      }


      .box:hover {
        background-color: #adb5bd;
      }

      .various-icons {
        width: 50px;
        height: 50px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

  <div class="app-wrapper">
    <div th:replace="~{fragments/adminNav :: adminNav}"></div>
    <div th:replace="~{fragments/adminSide :: adminSide}"></div>
    <main>
      <div class="container">
        <div class="box" onclick="location.href='user_management.html'">
          <img src="/icon/user.png" class="various-icons">
          <h2>회원 관리</h2>
        </div>
        <div class="box" onclick="location.href='product_management.html'">
          <img src="/icon/Book.png" class="various-icons">
          <h2>등록 관리</h2>
        </div>
        <div class="box" onclick="location.href='order_management.html'">
          <img src="/icon/rent.png" class="various-icons">
          <h2>대출 관리</h2>
        </div>
        <div class="box" th:onclick="|location.href='@{/api/subject/all}'|">
          <img src="/icon/Book%20open.png" class="various-icons">
          <h2>주제 관리</h2>
        </div>
      </div>
    </main>
  </div>


  </body>

</html>
