<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 대여 사이트</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        .user-sidebar-body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }

        .user-sidebar-top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #fff;
            border-bottom: 2px solid #ddd;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 5px 5px 0 0;

        }

        .user-sidebar-top-nav .user-sidebar-header-logo {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: #0f4e8a;
        }

        .user-sidebar-nav-links {
            display: flex;
            gap: 15px;
        }

        .user-sidebar-nav-links a {
            color: #333;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .user-sidebar-nav-links a:hover {
            color: #0f4e8a;
        }

        .user-sidebar-search-box {
            position: relative;
            width: 40%;
            max-width: 500px;
        }

        .user-sidebar-search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            background-color: #fff;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: gray;
            font-size: 22px;
        }

        .rent-page-body .user-sidebar-top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: calc(100% - 250px);
            margin-left: 250px;
            box-sizing: border-box;
        }

        .rent-history-body .user-sidebar-top-nav{
            position: fixed;
            top: 0;
            left: 0;
            width: calc(100% - 250px);
            margin-left: 250px;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="user-sidebar-body">

<nav class="user-sidebar-top-nav">
    <a href="#" class="user-sidebar-header-logo">📚 BookRent</a>
    <div class="user-sidebar-search-box">
        <i class="material-icons search-icon">search</i>
        <input type="text" class="user-sidebar-search-input" placeholder="책 검색...">
    </div>
    <div class="user-sidebar-nav-links">
        <a href="#">로그인</a>
        <a href="#">회원가입</a>
        <a href="#">마이페이지</a>
    </div>
</nav>
</body>
</html>
