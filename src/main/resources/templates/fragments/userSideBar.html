<!DOCTYPE html>
<html lang="ko">

<head>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <style>
    .user-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100vh;
      background-color: #343a40;
      z-index: 1000;
      transition: width 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .user-sidebar-brand {
      background-color: #212529;
      color: white;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .user-brand-link {
      text-align: center;
      display: block;
    }

    .user-sidebar-brand .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-nav-link {
      color: rgba(255, 255, 255, 0.56);
      font-size: 16px;
      padding: 10px 15px;
      text-decoration: none;
      transition: background-color 0.3s ease, color 0.3s ease;
      display: flex;
      align-items: center;
    }

    .user-nav-link:hover {

      color: #fff;
    }

    .user-nav-item {
      width: 100%;
    }

    .user-nav-treeview {
      padding-left: 20px;
    }

    .user-sidebar-menu {
      list-style-type: none;
      padding-left: 0;
      width: 100%;
      align-items: center;
      justify-content: center;
    }

    .user-sidebar-menu,
    .user-nav-treeview {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .user-no-bullets {
      list-style-type: none;
      padding-left: 0;
    }

  </style>
</head>

<aside th:fragment="userSide" id="userSidebar" class="user-sidebar bg-body-secondary shadow" data-bs-theme="dark">
  <div class="user-sidebar-brand">
    <a th:onclick="|location.href='@{/}'|" class="user-brand-link">
      <div class="user-info">
        <i class="material-icons">account_circle</i>
        <span>홍길동</span>
      </div>
    </a>
  </div>

  <div>
    <nav>
      <ul class="nav user-sidebar-menu flex-column user-no-bullets" role="menu" data-accordion="false">
        <li class="user-nav-item menu-open">
          <ul class="nav user-nav-treeview no-bullets">
            <li class="user-nav-item">
              <a th:onclick="|location.href='@{/api/rent/1}'|"  class="user-nav-link active">
                <p>상호대차 현황</p>
              </a>
            </li>
            <li class="user-nav-item">
              <a th:onclick="|location.href='@{/api/rent/history/1}'|" class="user-nav-link">
                <p>상호대차 이력 조회</p>
              </a>
            </li>
            <li class="user-nav-item" style="cursor: pointer;">
              <a th:onclick="|location.href='@{}'|" class="user-nav-link">
                <p>도서관 변경</p>
              </a>
            </li>
            <li class="user-nav-item" style="cursor: pointer;">
              <a th:onclick="|location.href='@{}'|" class="user-nav-link">
                <p>회원 탈퇴</p>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </nav>
  </div>
</aside>
</html>
