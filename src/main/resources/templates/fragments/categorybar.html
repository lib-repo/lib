<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>

    .category-menu {
      display: flex;
      justify-content: center;
      background: #33afe9;;
      padding: 12px 0;
    }

    .category-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 20px;
    }

    .category-menu ul > li {
      position: relative;
      font-size: 16px;
      font-weight: bold;
    }

    .category-menu ul > li > a {
      text-decoration: none;
      color: white;
      padding: 10px 15px;
      display: block;
      transition: background 0.3s ease;
    }

    .category-menu ul > li:hover > a {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
    }

    .category-menu ul > li > ul {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: white;
      border: 1px solid #ccc;
      padding: 0;
      min-width: 150px;
      z-index: 1;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 5px;
    }

    .category-menu ul > li > ul li {
      padding: 10px;
      font-size: 14px;
    }

    .category-menu ul > li > ul li a {
      text-decoration: none;
      color: black;
      display: block;
      padding: 8px 12px;
      transition: background 0.3s ease;
    }

    .category-menu ul > li > ul li a:hover {
      background-color: #f1f1f1;
    }

    .category-menu ul > li:hover > ul {
      display: block;
    }

    body .category-menu{
      position: absolute;
      width: 100%;
      top: 75px;
      left: 0;
      z-index: 1000;
    }
  </style>
</head>
