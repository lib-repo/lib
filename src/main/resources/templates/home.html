<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" rel="stylesheet" href="/css/materialize.css"  media="screen,projection"/>
  <link rel="stylesheet" href="/css/card.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="row">
    <div class="col s12 m6 l3" th:each="book : ${books}">
      <div class="card">
        <a th:href="@{/books/{id}(id=${book.bookId})}" class="card-link">
          <div class="card-image">
            <img th:src="@{${book.imageUrl}}" alt="Book Image">
          </div>
          <div class="card-content">
            <p class="book-title" th:text="${book.title}"></p>
            <p class="book-author" th:text="${book.author}"></p>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/book.js"></script>
  <script type="text/javascript" src="/js/materialize.js"></script>
</body>
</html>
