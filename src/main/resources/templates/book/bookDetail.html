<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 상세 정보</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="/css/table.css">
    <link rel="stylesheet" href="/css/bookDetail.css">
</head>
<body th:attr="data-book-id=${book?.bookId}">

<div th:replace="~{fragments/userHeader}"></div>
<div th:replace="~{fragments/categorybar (subjects=${subjects})}"></div>

<div class="main-content">
    <div>
        <h4 class="justify-start" th:text="${book.title}"></h4>
        <h6 class="justify-start" th:text="${book.author}"></h6>
    </div>

    <div class="divider"></div>

    <div class="container">
        <img class="book-image" th:src="${book.imageUrl}" th:alt="${book.title}">
        <div class="book-info">
            <p>출판사 : <span th:text="${book.publisher}"></span></p>
            <p>출판년도 : <span th:text="${book.publicationYear}"></span></p>
            <p>ISBN : <span th:text="${book.isbn}"></span></p>
            <p th:text="${book.description}"></p>
        </div>
    </div>

    <div class="divider"></div>

    <form id="libraryForm" method="get" th:action="@{/books/{bookId}(bookId=${book?.bookId})}">
<!--        <label for="librarySelect">도서관 선택:</label>-->
        <select id="librarySelect" name="selectedLibraryId" class="detail-select" onchange="this.form.submit()">
            <option value="">도서관을 선택하세요</option>
            <option th:each="lib : ${libs}"
                    th:value="${lib.library.getLibraryId()}"
                    th:text="${lib.library.libraryName}"
                    th:selected="${selectedLibraryId != null and selectedLibraryId == lib.library.getLibraryId()}">
            </option>
        </select>
    </form>

    <div>
        <h5 class="justify-start">협약된 상호대차 도서관</h5>
        <table class="highlight">
            <thead>
            <tr>
                <th>도서관</th>
                <th>주소</th>
                <th>전화번호</th>
                <th>신청</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lib : ${partnerLibraries}">
                <td th:text="${lib.getLibraryName()}"></td>
                <td th:text="${lib.getLibraryLocation()}"></td>
                <td th:text="${lib.getLibraryPhone()}"></td>
                <td>
                    <a class="btn-flat rent-btn"
                       th:attr="data-library-id=${lib.getLibraryId()}"
                       onclick="requestLoan(this)">신청하기</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var elems = document.querySelectorAll('select');
        M.FormSelect.init(elems);
    });
</script>
</body>
</html>
