<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기</title>
  <link rel="stylesheet" href="/css/user/find-password.css">
</head>
<body>
<div class="container">
  <h2>비밀번호 찾기</h2>
  <hr>
  <form id="find-password-form">
    <label for="userId">아이디</label>
    <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" required>

    <label for="email">이메일</label>
    <div class="email-group">
      <input type="text" id="email" name="emailLocalPart" placeholder="이메일" required>
      <span>@</span>
      <select id="email-domain" name="emailDomain">
        <option value="">선택해주세요</option>
        <option value="naver.com">naver.com</option>
        <option value="gmail.com">gmail.com</option>
        <option value="daum.net">daum.net</option>
        <option value="kakao.com">kakao.com</option>
        <option value="nate.com">nate.com</option>
      </select>
    </div>

    <button type="button" id="send-code">인증번호 받기</button>

    <label for="verificationCode" class="hidden">인증번호 입력</label>
    <input type="text" id="verificationCode" name="verificationCode" class="hidden" placeholder="인증번호 입력">

    <label for="newPassword" class="hidden">새 비밀번호</label>
    <input type="password" id="newPassword" name="newPassword" class="hidden" placeholder="새 비밀번호 입력">

    <button type="submit" class="hidden" id="reset-password-btn">비밀번호 변경</button>
  </form>

  <p><a href="/user/login">로그인 페이지로 돌아가기</a></p>
</div>

<script src="/js/user/find-password.js"></script>
</body>
</html>
