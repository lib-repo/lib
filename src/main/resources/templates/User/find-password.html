<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>비밀번호 찾기</title>
</head>
<body>
<h2>비밀번호 찾기</h2>

<!-- 1단계: 아이디 + 이메일 입력 후 인증번호 받기 -->
<form action="/user/find-password/send-code" method="post" th:if="${step} == null">
  <label>아이디:</label>
  <input type="text" name="userId" required><br>

  <label>이메일:</label>
  <input type="email" name="email" required><br>

  <button type="submit">인증번호 받기</button>
</form>

<!-- 2단계: 인증번호 입력 후 새 비밀번호 변경 -->
<form action="/user/find-password/reset" method="post" th:if="${step} == 'verify'">
  <input type="hidden" name="userId" th:value="${userId}">
  <input type="hidden" name="email" th:value="${email}">

  <label>인증번호:</label>
  <input type="text" name="code" required><br>

  <label>새 비밀번호:</label>
  <input type="password" name="newPassword" required><br>

  <button type="submit">비밀번호 변경</button>
</form>

<p th:if="${message}" style="color:green;">[[${message}]]</p>
<p th:if="${error}" style="color:red;">[[${error}]]</p>
</body>
</html>
