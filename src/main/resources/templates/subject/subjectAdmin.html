<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thymeleaf Fragment Example</title>
<!--    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">-->
    <link rel="stylesheet" type="text/css" th:href="@{/css/subject.css}">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            integrity="sha256-9kPW/n5nn53j4WMRYAxe9c1rCY96Oogo/MKSVdKzPmI="
            crossorigin="anonymous"
    />
    <link rel="stylesheet" type="text/css" th:href="@{/css/adminlte.css}">
    <script type="text/javascript" th:src="@{/js/adminSidebar.js}"></script>
    <title>책 주제 관리</title>
</head>
<body>
<!-- Nav Fragment 호출 -->
<!--<div th:replace="~{fragments/nav :: nav}"></div>-->

<div class="app-wrapper">
    <div th:replace="~{fragments/adminNav :: adminNav}"></div>
    <div th:replace="~{fragments/adminSide :: adminSide}"></div>
    <main>
        <div class="container">
            <div class="title">책 주제
                <button class="create" onclick="addSubject()">추가</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>기능</th>
                     </tr>
                </thead>
                <tbody>
                <tr th:each="subject : ${subjects}">
                    <td class="subject_detail" th:text="${subject.name}"></td>
                    <td>
                        <button class="edit" th:onclick="|makeEditable(this, '${subject.id}')|">
                            <img src="/icon/modify.png" class="modify"></img>
                        </button>
                        <img src="/icon/delete.png" class="delete" th:onclick="|deleteSubject(${subject.id})|"></img>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </main>
</div>


<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    // 수정 시작
    function makeEditable(button, subjectId) {
        var td = button.parentElement.previousElementSibling;
        var originalValue = td.innerText.trim();


        if (!td.querySelector('input')) {
            var input = document.createElement('input');
            input.type = 'text';
            input.value = originalValue;
            input.classList.add('editable-input');
            td.innerText = '';
            td.appendChild(input);
            input.focus();

            input.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' && !event.repeat) {
                    event.preventDefault();
                    saveEditable(input, td, button, subjectId, originalValue);
                    input.blur();
                } else if (event.key === 'Escape') {
                    td.innerText = originalValue; // ESC 키를 누르면 원래 값으로 복구
                }
            });
        }
    }

    function saveEditable(input, td, button, subjectId, originalValue) {
        var updatedValue = input.value.trim();

        if (updatedValue === originalValue) {
            td.innerText = originalValue;
            return;
        }

        if (updatedValue === "") {
            alert('주제 값으로 공백이 올 수 없습니다.');
            td.innerText = originalValue;
            return;
        }

        td.innerText = updatedValue;
        button.onclick = function () {
            makeEditable(button, subjectId);
        };

        var data = { name: updatedValue, id: subjectId };

        axios.put('/api/subject/update', data)
            .then(function (response) {
                console.log('Success:', response.data);
            })
            .catch(function (error) {
                console.error('Error:', error);
            });
    }
    // 수정 끝

    // 추가 시작
    function addSubject() {
        let tbody = document.querySelector("tbody");
        let newRow = document.createElement("tr");

        newRow.innerHTML = `
        <td class="subject_detail">
            <input type="text" class="new-subject" placeholder="주제 입력 후 엔터">
        </td>
        <td>
            <button class="edit" disabled>
                <img src="/icon/modify.png" class="modify">
            </button>
            <img src="/icon/delete.png" class="delete">
        </td>
    `;

        tbody.appendChild(newRow);

        let input = newRow.querySelector(".new-subject");
        input.focus();

        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                let subjectName = input.value.trim();
                if (subjectName) {
                    axios.post('/api/subject', { name: subjectName })
                        .then(function (response) {
                            console.log("추가 성공:", response.data);
                            location.reload();
                        })
                        .catch(function (error) {
                            console.error("오류 발생:", error);
                        });
                }
            } else if (event.key === "Escape") {
                newRow.remove(); // Esc 키를 누르면 입력 취소
            }
        });

    }
    //추가 끝


    function deleteSubject(subjectId) {
        if (confirm("정말로 삭제하시겠습니까?")) {
            axios.delete('/api/subject/' + subjectId)
                .then(function (response) {
                    alert("삭제 완료되었습니다.");
                    location.reload();
                })
                .catch(function (error) {
                    alert("삭제 중 오류 발생: " + error.response.data);
                    console.error('오류 발생:', error);
                });
        }
    }

</script>
</body>
</html>
